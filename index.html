<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>诗词大会小学高段在线题库</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;padding:20px;color:#1f2937}
.box{max-width:820px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 30px #0001}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid #e5e7eb;background:#f8fafc;color:#374151;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.tab.on{background:#2563eb;border-color:#2563eb;color:#fff}
.sections{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.secBtn{border:1px dashed #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.secBtn:hover{background:#f1f5f9;border-color:#94a3b8}
.bar{display:flex;justify-content:space-between;color:#555;font-size:14px;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.q{font-size:18px;font-weight:600;line-height:1.7;margin-bottom:12px}
.o{display:block;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;cursor:pointer}
.o:hover{background:#f0f9ff;border-color:#93c5fd}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 18px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
button:disabled{background:#9ca3af;cursor:not-allowed}
.sec{background:#e5e7eb;color:#111}
.favBtn{background:#fff7ed;color:#c2410c;border:1px solid #fdba74}
.favBtn.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
.res{margin-top:14px;padding:12px;border-radius:10px;display:none;line-height:1.6}
.ok{background:#ecfdf5;color:#065f46}
.no{background:#fef2f2;color:#991b1b}
.empty{text-align:center;padding:40px 0;color:#6b7280;line-height:1.8}
.tip{font-size:13px;color:#6b7280;margin-top:6px}
.foot{margin-top:22px;text-align:center}
.foot button{font-size:13px;padding:7px 14px}
</style>
</head>
<body>
<div class="box">
  <div class="tabs">
    <button class="tab on" data-mode="all">全部题目</button>
    <button class="tab" data-mode="fav">⭐ 我的收藏 <span id="favCount">0</span></button>
    <button class="tab" data-mode="wrong">❌ 错题本 <span id="wrongCount">0</span></button>
  </div>

  <div class="sections">
    <button class="secBtn" data-start="0">1～50</button>
    <button class="secBtn" data-start="50">51～100</button>
    <button class="secBtn" data-start="100">101～146</button>
  </div>

  <div class="bar"><span id="p"></span><span id="s"></span></div>
  <div id="q"></div>

  <div class="btns">
    <button id="prev" class="sec">← 上一题</button>
    <button id="fav" class="favBtn">☆ 收藏本题</button>
    <button id="sub">提交本题</button>
  </div>

  <div id="res" class="res"></div>

  <div class="foot">
    <button class="sec" id="resetBtn">清空收藏与错题本</button>
    <button class="sec" id="resetProgress">清空答题进度</button>
  </div>
</div>

<script src="q1.js"></script>
<script src="q2.js"></script>
<script src="q3.js"></script>

<script>
const Q = [].concat(window.Q1 || [], window.Q2 || [], window.Q3 || []);
const LS_FAV='poemFav_v2';
const LS_WRONG='poemWrong_v2';
const LS_PROG='poemProgress_v2';

const $=id=>document.getElementById(id);
const pEl=$('p'), sEl=$('s'), qEl=$('q'), resEl=$('res');
const subBtn=$('sub'), favBtn=$('fav'), prevBtn=$('prev');
const favCountEl=$('favCount'), wrongCountEl=$('wrongCount');

function load(k,def){try{const v=JSON.parse(localStorage.getItem(k));return v==null?def:v}catch(e){return def}}
function save(){
  localStorage.setItem(LS_FAV,JSON.stringify([...favs]));
  localStorage.setItem(LS_WRONG,JSON.stringify([...wrongs]));
  localStorage.setItem(LS_PROG,JSON.stringify(progress));
}

let favs=new Set(load(LS_FAV,[]));
let wrongs=new Set(load(LS_WRONG,[]));
let progress=load(LS_PROG,{mode:'all',pos:0,score:0,answeredIdx:[]});
let mode=progress.mode||'all';
let list=[],pos=progress.pos||0,answered=false,score=progress.score||0;
let answeredSet=new Set(progress.answeredIdx||[]);

function buildList(){
  if(mode==='all') list=Q.map((_,i)=>i);
  else if(mode==='fav') list=[...favs].sort((a,b)=>a-b);
  else list=[...wrongs].sort((a,b)=>a-b);
  if(pos>=list.length) pos=0;
}
function updateCounts(){
  favCountEl.textContent=favs.size;
  wrongCountEl.textContent=wrongs.size;
}
function saveProgress(){
  progress={mode,pos,score,answeredIdx:[...answeredSet]};
  save();
}
function syncFavBtn(){
  const idx=list[pos];
  const on=favs.has(idx);
  favBtn.textContent=on?'★ 已收藏':'☆ 收藏本题';
  favBtn.classList.toggle('on',on);
}
function markAnsweredInputs(){
  const idx=list[pos];
  if(!answeredSet.has(idx)) return;
  const x=Q[idx];
  const correct=Array.isArray(x[3])?[...x[3]].sort((a,b)=>a-b):[x[3]];
  const inputs=document.querySelectorAll('input[name="a"]');
  inputs.forEach(el=>{
    const v=+el.value;
    el.checked=correct.includes(v);
    el.disabled=true;
  });
  resEl.style.display='block';
  resEl.className='res ok';
  resEl.innerHTML='<b>本题已作答</b><br>正确答案：'+correct.map(v=>String.fromCharCode(65+v)).join('、');
  subBtn.disabled=true;
  answered=true;
}
function render(){
  answered=false;
  subBtn.disabled=false;
  resEl.style.display='none';resEl.className='res';
  updateCounts();

  if(list.length===0){
    pEl.textContent='';
    sEl.textContent='得分：'+score;
    const msg = mode==='fav' ? '还没有收藏任何题目，去“全部题目”里点 ☆ 收藏吧' : '错题本是空的，真棒！';
    qEl.innerHTML='<div class="empty">'+msg+'</div>';
    favBtn.disabled=true;subBtn.disabled=true;prevBtn.disabled=true;
    return;
  }

  const idx=list[pos], x=Q[idx];
  pEl.textContent='第 '+(pos+1)+' / '+list.length+' 题（题库编号 '+(idx+1)+'）';
  sEl.textContent='得分：'+score;

  let h='<div class="q">'+(pos+1)+'. '+x[1]+'</div>';
  x[2].split('|').forEach((o,j)=>{
    h+='<label class="o"><input type="'+(x[0]==='m'?'checkbox':'radio')+'" name="a" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+o+'</label>';
  });
  qEl.innerHTML=h;
  favBtn.disabled=false;
  prevBtn.disabled=(pos===0);
  syncFavBtn();
  markAnsweredInputs();
  saveProgress();
}
function getAns(){
  return [...document.querySelectorAll('input[name="a"]:checked')].map(e=>+e.value).sort((a,b)=>a-b);
}
prevBtn.onclick=()=>{
  if(pos>0){pos--;render();}
};
favBtn.onclick=()=>{
  if(list.length===0)return;
  const idx=list[pos];
  if(favs.has(idx)) favs.delete(idx); else favs.add(idx);
  save();updateCounts();syncFavBtn();
};
subBtn.onclick=()=>{
  if(answered||list.length===0)return;
  const idx=list[pos], x=Q[idx], a=getAns();
  if(!a.length) return alert('请先选择答案');
  const c=Array.isArray(x[3])?[...x[3]].sort((a,b)=>a-b):[x[3]];
  const ok=JSON.stringify(a)===JSON.stringify(c);
  answered=true;
  let tip='';
  if(ok){
    if(!answeredSet.has(idx)) score++;
    if(wrongs.has(idx)){wrongs.delete(idx);tip='已从错题本移除';}
  }else{
    if(!wrongs.has(idx)) tip='已加入错题本';
    wrongs.add(idx);
  }
  answeredSet.add(idx);
  save();updateCounts();saveProgress();
  sEl.textContent='得分：'+score;
  subBtn.disabled=true;
  resEl.style.display='block';
  resEl.className='res '+(ok?'ok':'no');
  resEl.innerHTML='<b>'+(ok?'回答正确':'回答错误')+'</b><br>正确答案：'+c.map(v=>String.fromCharCode(65+v)).join('、')+(tip?'<div class="tip">'+tip+'</div>':'');
  document.querySelectorAll('input[name="a"]').forEach(e=>e.disabled=true);
  setTimeout(()=>{
    if(pos<list.length-1){pos++;render();}
    else{
      pEl.textContent='本轮完成';
      sEl.textContent='得分：'+score;
      qEl.innerHTML='<div class="empty"><h2>本轮已完成！</h2><p>本轮共 '+list.length+' 题，累计答对 '+score+' 题</p></div>';
      favBtn.disabled=true;subBtn.disabled=true;prevBtn.disabled=true;
      resEl.style.display='none';
    }
  },1200);
};
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    mode=t.dataset.mode;
    pos=0;buildList();render();saveProgress();
  };
});
document.querySelectorAll('.secBtn').forEach(b=>{
  b.onclick=()=>{
    mode='all';
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='all'));
    buildList();
    const start=+b.dataset.start;
    pos=Math.min(start,list.length-1);
    render();saveProgress();
  };
});
$('resetBtn').onclick=()=>{
  if(confirm('确定要清空收藏和错题本吗？（此操作不可恢复）')){
    favs.clear();wrongs.clear();
    mode='all';pos=0;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='all'));
    buildList();render();save();
  }
};
$('resetProgress').onclick=()=>{
  if(confirm('确定要清空答题进度和得分吗？（收藏和错题本不受影响）')){
    score=0;answeredSet=new Set();pos=0;
    saveProgress();render();
  }
};
buildList();
render();
</script>
</body>
</html>
