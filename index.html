let i=0,score=0,done=false;
const p=document.getElementById("p"),s=document.getElementById("s"),q=document.getElementById("q"),res=document.getElementById("res"),sub=document.getElementById("sub"),next=document.getElementById("next");
function render(){
  done=false;sub.disabled=false;next.disabled=true;res.style.display="none";
  const x=Q[i];
  p.textContent=`第 ${i+1} / ${Q.length} 题`;
  s.textContent=`得分：${score}`;
  let h=`<div class="q">${i+1}. ${x[1]}</div>`;
  x[2].split("|").forEach((o,j)=>{
    h+=`<label class="o"><input type="${x[0]==="m"?"checkbox":"radio"}" name="a" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`;
  });
  q.innerHTML=h;
}
function getAns(){
  return [...document.querySelectorAll('input[name="a"]:checked')].map(e=>+e.value).sort((a,b)=>a-b);
}
sub.onclick=()=>{
  if(done)return;
  const x=Q[i],a=getAns();
  if(!a.length)return alert("请先选择答案");
  const c=Array.isArray(x[3])?x[3].slice().sort((a,b)=>a-b):[x[3]];
  const ok=JSON.stringify(a)===JSON.stringify(c);
  if(ok)score++;
  done=true;sub.disabled=true;next.disabled=false;
  s.textContent=`得分：${score}`;
  res.style.display="block";
  res.className="res "+(ok?"ok":"no");
  res.innerHTML=`<b>${ok?"回答正确":"回答错误"}</b><br>正确答案：${c.map(v=>String.fromCharCode(65+v)).join("、")}`;
  document.querySelectorAll('input[name="a"]').forEach(e=>e.disabled=true);
};
next.onclick=()=>{
  if(i<Q.length-1){i++;render();}
  else{
    q.innerHTML=`<h2 style="text-align:center">答题完成！得分：${score} / ${Q.length}</h2>`;
    p.textContent="答题完成";s.textContent="";
    sub.disabled=true;next.disabled=true;res.style.display="none";
  }
};
render();
